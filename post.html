<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章 - aleee</title>
  <meta name="description" content="Obsidian notes published as a reading-first blog.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/post.css">
  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script type="module" src="./js/post.js"></script>
</head>
<body>
  <div class="page-noise" aria-hidden="true"></div>
  <div class="page-orb page-orb-a" aria-hidden="true"></div>
  <div class="page-orb page-orb-b" aria-hidden="true"></div>

  <div class="reading-progress" aria-hidden="true">
    <div id="readingProgressBar" class="reading-progress__bar"></div>
  </div>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="./index.html">
        <span class="brand__mark">aleee</span>
        <span class="brand__meta">notes on the web</span>
      </a>

      <nav class="header-actions" aria-label="页面导航">
        <a class="header-link" href="./index.html">返回首页</a>
        <button id="mobileToolsToggle" class="header-icon-btn" type="button" aria-expanded="false" aria-controls="sideRail">
          工具
        </button>
      </nav>
    </div>
  </header>

  <main class="page-shell">
    <article class="article-panel">
      <div id="loadingState" class="state-card">
        <div class="state-card__line state-card__line--title"></div>
        <div class="state-card__line state-card__line--meta"></div>
        <div class="state-card__line"></div>
        <div class="state-card__line"></div>
        <div class="state-card__line state-card__line--short"></div>
      </div>

      <div id="errorState" class="state-card state-card--error" hidden>
        <p class="state-card__eyebrow">Load Failed</p>
        <h1 class="state-card__title">文章加载失败</h1>
        <p class="state-card__text">没有找到对应内容，或者文章资源暂时不可用。</p>
        <a class="chip-link" href="./index.html">返回首页</a>
      </div>

      <section id="postContent" class="post-layout" hidden>
        <header class="post-hero">
          <p class="post-hero__eyebrow">Obsidian Reader</p>
          <h1 id="postTitle" class="post-hero__title"></h1>
          <p id="postSummary" class="post-hero__summary" hidden></p>

          <div class="post-meta-row">
            <span id="postCategory" class="meta-pill"></span>
            <span id="postDate" class="meta-pill" hidden></span>
            <span id="postReadTime" class="meta-pill"></span>
            <span id="postWordCount" class="meta-pill"></span>
          </div>

          <div class="post-hero__path-wrap">
            <span class="post-hero__path-label">Vault Path</span>
            <code id="postPath" class="post-hero__path"></code>
          </div>
        </header>

        <div id="postBody" class="post-content markdown-body"></div>
      </section>
    </article>

    <aside id="sideRail" class="side-rail" aria-label="阅读工具">
      <section class="side-card side-card--sticky-top">
        <div class="side-card__header">
          <p class="side-card__eyebrow">Article</p>
          <h2 class="side-card__title">文章信息</h2>
        </div>

        <dl class="meta-grid">
          <div class="meta-grid__item">
            <dt>分类</dt>
            <dd id="metaCategory">-</dd>
          </div>
          <div class="meta-grid__item">
            <dt>日期</dt>
            <dd id="metaDate">-</dd>
          </div>
          <div class="meta-grid__item">
            <dt>阅读</dt>
            <dd id="metaReadTime">-</dd>
          </div>
          <div class="meta-grid__item">
            <dt>字数</dt>
            <dd id="metaWordCount">-</dd>
          </div>
        </dl>

        <div class="tag-strip" id="tagStrip"></div>
      </section>

      <section class="side-card">
        <div class="side-card__header">
          <p class="side-card__eyebrow">Tools</p>
          <h2 class="side-card__title">阅读工具</h2>
        </div>

        <div class="tool-grid">
          <button id="decreaseFontBtn" class="tool-btn" type="button">A-</button>
          <button id="increaseFontBtn" class="tool-btn" type="button">A+</button>
          <button id="toggleWidthBtn" class="tool-btn tool-btn--wide" type="button">切换宽度</button>
          <button id="copyLinkBtn" class="tool-btn tool-btn--wide" type="button">复制链接</button>
          <button id="favoriteBtn" class="tool-btn tool-btn--wide" type="button">收藏文章</button>
          <button id="scrollTopBtn" class="tool-btn tool-btn--wide" type="button">回到顶部</button>
        </div>

        <p id="actionFeedback" class="action-feedback" aria-live="polite"></p>
      </section>

      <section class="side-card">
        <div class="side-card__header">
          <p class="side-card__eyebrow">Outline</p>
          <h2 class="side-card__title">目录</h2>
        </div>

        <div id="tocEmpty" class="side-card__empty">当前文章没有标题目录。</div>
        <nav id="tocList" class="toc-list" aria-label="文章目录"></nav>
      </section>

      <section class="side-card">
        <div class="side-card__header">
          <p class="side-card__eyebrow">Nearby</p>
          <h2 class="side-card__title">相关笔记</h2>
        </div>

        <div id="relatedList" class="related-list"></div>
      </section>
    </aside>
  </main>

  <button id="backToTopBtn" class="floating-top-btn" type="button" aria-label="回到顶部">
    ↑
  </button>
</body>
</html>
