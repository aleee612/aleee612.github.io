<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aleee</title>
  <meta name="description" content="aleee notes home">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/home.css">
</head>
<body>
  <div class="page-noise" aria-hidden="true"></div>

  <header class="site-top">
    <div class="site-top__inner">
      <a class="brand" href="./index.html">
        <span class="brand__mark">aleee</span>
        <span class="brand__sub">notes / blog / archive</span>
      </a>

      <div class="site-top__search">
        <label class="search-box" for="searchInput">
          <span class="search-box__icon">/</span>
          <input id="searchInput" type="search" placeholder="">
        </label>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="hero-strip">
      <div class="hero-strip__copy">
        <p id="heroEyebrow" class="hero-strip__eyebrow"></p>
        <h1 id="heroTitle"></h1>
        <p id="heroIntro"></p>
      </div>

      <div class="hero-strip__stats">
        <div class="stat-chip">
          <span id="statPostsLabel"></span>
          <strong id="totalPosts">0</strong>
        </div>
        <div class="stat-chip">
          <span id="statTopicsLabel"></span>
          <strong id="totalTopics">0</strong>
        </div>
        <div class="stat-chip">
          <span id="statTagsLabel"></span>
          <strong id="totalTags">0</strong>
        </div>
      </div>
    </section>

    <div class="layout-grid">
      <div class="main-column">
        <section class="panel">
          <div class="section-head">
            <div>
              <p id="featuredEyebrow" class="section-head__eyebrow"></p>
              <h2 id="featuredSectionTitle"></h2>
            </div>
            <a id="featuredLink" class="section-head__action" href="./post.html"></a>
          </div>

          <div class="spotlight-grid">
            <a id="featuredCard" class="featured-card" href="./post.html">
              <div class="featured-card__meta">
                <span id="featuredDate"></span>
                <span id="featuredCategory"></span>
              </div>
              <h3 id="featuredTitle"></h3>
              <p id="featuredPath"></p>
            </a>

            <div id="recentList" class="recent-list"></div>
          </div>
        </section>

        <section class="panel">
          <div class="section-head">
            <div>
              <p id="topicsEyebrow" class="section-head__eyebrow"></p>
              <h2 id="topicsTitle"></h2>
            </div>
          </div>

          <div id="topicChips" class="topic-chips"></div>
        </section>

        <section class="panel">
          <div class="toolbar">
            <div class="toolbar__title">
              <p id="postsEyebrow" class="section-head__eyebrow"></p>
              <h2 id="postsTitle"></h2>
            </div>

            <div class="toolbar__actions">
              <label class="select-box" for="sortSelect">
                <select id="sortSelect">
                  <option value="latest"></option>
                  <option value="title"></option>
                </select>
              </label>
              <button id="resetFiltersBtn" class="ghost-btn" type="button"></button>
            </div>
          </div>

          <div class="active-row">
            <span id="activeFiltersLabel" class="active-row__label"></span>
            <div id="activeFilters" class="active-row__chips"></div>
          </div>

          <div id="resultMeta" class="result-meta"></div>
          <div id="postList" class="post-grid"></div>
        </section>

        <section class="panel">
          <div class="section-head">
            <div>
              <p id="archiveEyebrow" class="section-head__eyebrow"></p>
              <h2 id="archiveTitle"></h2>
            </div>
          </div>

          <div id="vaultTree" class="vault-tree"></div>
        </section>
      </div>

      <aside class="side-column">
        <section class="panel profile-card">
          <img class="profile-card__avatar" src="./images/avatar.jpg" alt="avatar">
          <div>
            <h2 id="profileTitle" class="profile-card__title"></h2>
            <p id="profileText" class="profile-card__text"></p>
          </div>
        </section>

        <section class="panel side-panel">
          <div class="section-head section-head--compact">
            <div>
              <p id="tagsEyebrow" class="section-head__eyebrow"></p>
              <h2 id="tagsTitle"></h2>
            </div>
          </div>
          <div id="tagCloud" class="tag-cloud"></div>
        </section>

        <section class="panel side-panel">
          <div class="section-head section-head--compact">
            <div>
              <p id="recentEyebrow" class="section-head__eyebrow"></p>
              <h2 id="recentTitle"></h2>
            </div>
          </div>
          <div id="recentMiniList" class="mini-list"></div>
        </section>
      </aside>
    </div>
  </main>

  <script src="./js/home.js"></script>
</body>
</html>
