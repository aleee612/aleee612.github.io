<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aleee - 笔记主页</title>
  <meta name="description" content="一个更适合检索、浏览与回看的 Obsidian 笔记主页。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600;6..72,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/home.css">
</head>
<body>
  <div class="page-grid" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand-block">
        <p class="brand-block__eyebrow">ALEEE VAULT</p>
        <h1 class="brand-block__title">一个更适合查找和回看的笔记首页</h1>
        <p class="brand-block__intro">
          保留 Obsidian 的结构感，但首页优先解决两件事：快速找到内容，以及清楚地知道从哪里开始看。
        </p>
      </div>

      <div class="overview-strip">
        <div class="overview-pill">
          <span>文章</span>
          <strong id="totalPosts">0</strong>
        </div>
        <div class="overview-pill">
          <span>专题</span>
          <strong id="totalTopics">0</strong>
        </div>
        <div class="overview-pill">
          <span>标签</span>
          <strong id="totalTags">0</strong>
        </div>
      </div>
    </div>
  </header>

  <main class="workspace">
    <section class="control-panel">
      <div class="control-panel__main">
        <label class="search-box" for="searchInput">
          <span class="search-box__label">搜索笔记</span>
          <input id="searchInput" type="search" placeholder="搜索标题、路径、分类..." autocomplete="off">
        </label>

        <label class="select-box" for="sortSelect">
          <span class="search-box__label">排序方式</span>
          <select id="sortSelect">
            <option value="latest">按最近更新</option>
            <option value="title">按标题 A-Z</option>
          </select>
        </label>

        <button id="resetFiltersBtn" class="ghost-btn" type="button">清空筛选</button>
      </div>

      <div class="active-filters">
        <span class="active-filters__label">当前筛选</span>
        <div id="activeFilters" class="active-filters__chips"></div>
      </div>
    </section>

    <div class="content-grid">
      <div class="main-column">
        <section class="panel">
          <div class="panel__header">
            <div>
              <p class="panel__eyebrow">Start Here</p>
              <h2 class="panel__title">推荐起点</h2>
            </div>
            <a id="featuredLink" class="panel__action" href="./post.html">打开文章</a>
          </div>

          <a id="featuredCard" class="featured-card" href="./post.html">
            <div class="featured-card__meta">
              <span id="featuredDate">最近整理</span>
              <span id="featuredCategory">分类</span>
            </div>
            <h3 id="featuredTitle">载入中...</h3>
            <p id="featuredPath">正在读取文章路径</p>
          </a>
        </section>

        <section class="panel">
          <div class="panel__header">
            <div>
              <p class="panel__eyebrow">Topics</p>
              <h2 class="panel__title">专题导航</h2>
            </div>
            <span class="panel__meta">按分类密度挑选入口</span>
          </div>

          <div id="topicGrid" class="topic-grid"></div>
        </section>

        <section class="panel">
          <div class="panel__header">
            <div>
              <p class="panel__eyebrow">Results</p>
              <h2 class="panel__title">文章列表</h2>
            </div>
            <span id="resultMeta" class="panel__meta">0 篇结果</span>
          </div>

          <div id="postList" class="post-list"></div>
        </section>

        <section id="vault-browser" class="panel">
          <div class="panel__header">
            <div>
              <p class="panel__eyebrow">Archive</p>
              <h2 class="panel__title">完整目录</h2>
            </div>
            <span class="panel__meta">需要时再展开</span>
          </div>

          <div id="vaultTree" class="vault-tree"></div>
        </section>
      </div>

      <aside class="side-column">
        <section class="panel side-panel">
          <div class="panel__header">
            <div>
              <p class="panel__eyebrow">Pinned</p>
              <h2 class="panel__title">高频分类</h2>
            </div>
          </div>

          <div id="topicRail" class="topic-rail"></div>
        </section>

        <section class="panel side-panel">
          <div class="panel__header">
            <div>
              <p class="panel__eyebrow">Tags</p>
              <h2 class="panel__title">标签密度</h2>
            </div>
          </div>

          <div id="tagCloud" class="tag-cloud"></div>
        </section>

        <section class="panel side-panel">
          <div class="panel__header">
            <div>
              <p class="panel__eyebrow">Recent</p>
              <h2 class="panel__title">最近 5 篇</h2>
            </div>
          </div>

          <div id="recentMiniList" class="mini-list"></div>
        </section>
      </aside>
    </div>
  </main>

  <script src="./js/home.js"></script>
</body>
</html>
